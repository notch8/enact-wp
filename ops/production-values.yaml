# Production environment overrides for ./wordpress.
# No secrets here -- DB credentials flow entirely through the ExternalSecret
# (1Password item referenced below), not through this file or GitHub secrets.

ingress:
  hostname: enact-wp-production.enacthyku.com

externalSecret:
  onePasswordItem: wordpress-mysql-production-enact

privateSite:
  enabled: true

# Flip enforce to true only after the Two Factor plugin is installed here and
# the administrators have enrolled (README.md, "Two-factor authentication").
twoFactor:
  enabled: true
  enforce: false
