suite: wordpress ExternalSecret
templates:
  - templates/externalsecret.yaml
set:
  ingress.hostname: example.test
  externalSecret.onePasswordItem: test-item
  externalSecret.storeName: onepassword-enact-staging
tests:
  - it: points at the per-environment ClusterSecretStore
    asserts:
      - equal:
          path: spec.secretStoreRef
          value:
            name: onepassword-enact-staging
            kind: ClusterSecretStore

  - it: uses the SDK provider's "item/field" remoteRef format, not Connect's property
    asserts:
      - contains:
          path: spec.data
          content:
            secretKey: auth-key
            remoteRef:
              key: test-item/auth-key
      - contains:
          path: spec.data
          content:
            secretKey: wordpress-password
            remoteRef:
              key: test-item/wordpress-password

  - it: fails to render without externalSecret.storeName
    set:
      externalSecret.storeName: ""
    asserts:
      - failedTemplate:
          errorMessage: "externalSecret.storeName is required"
