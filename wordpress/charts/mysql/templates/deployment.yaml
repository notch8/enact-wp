apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mysql
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # Velero's fs-backup only copies files on disk, so without this a backup is a
        # live copy of InnoDB's data files -- not guaranteed consistent. Dumps into a
        # dot-prefixed directory on the same (backed-up) data volume so mysqld's own
        # datadir scan on restart ignores it. MYSQL_PWD (not -p) keeps the root
        # password out of the process list.
        pre.hook.backup.velero.io/container: mysql
        pre.hook.backup.velero.io/command: '["/bin/bash", "-c", "set -o pipefail; mkdir -p /var/lib/mysql/.backup && MYSQL_PWD=$MYSQL_ROOT_PASSWORD mysqldump -uroot --single-transaction --routines --events --all-databases | gzip > /var/lib/mysql/.backup/dump.sql.gz.tmp && mv /var/lib/mysql/.backup/dump.sql.gz.tmp /var/lib/mysql/.backup/dump.sql.gz"]'
        pre.hook.backup.velero.io/timeout: 5m
        pre.hook.backup.velero.io/on-error: Fail
    spec:
      containers:
        - name: mysql
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MYSQL_DATABASE
              value: {{ .Values.global.database.name }}
            - name: MYSQL_USER
              value: {{ .Values.global.database.user }}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: root-password
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: wordpress-password
          ports:
            - containerPort: 3306
              name: mysql
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-mysql
          {{- else }}
          emptyDir: {}
          {{- end }}
