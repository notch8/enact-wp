{{- if .Values.privateSite.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-private-site
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  private-site.php: |
    <?php
    /**
     * Plugin Name: Private Site
     * Description: Forces every front-end request through WordPress's own
     * login screen (wp-admin and the install wizard are unaffected). Managed
     * by the enact-wp Helm chart's `privateSite.enabled` value -- see this
     * repo's README for how to turn this off.
     */
    add_action('template_redirect', function () {
        // Only challenge anonymous visitors. auth_redirect() alone would
        // also bounce logged-in users on front-end pages: over https it
        // validates the wordpress_sec_ cookie, which WordPress scopes to
        // /wp-admin, so browsers never send it here and every front-end
        // view loops back to wp-login. is_user_logged_in() validates the
        // site-wide logged_in cookie instead.
        if (!is_admin() && !is_user_logged_in()) {
            auth_redirect();
        }
    });
{{- end }}
