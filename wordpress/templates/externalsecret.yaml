{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.global.secretName }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: {{ .Values.global.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: root-password
      remoteRef:
        key: {{ required "externalSecret.onePasswordItem is required" .Values.externalSecret.onePasswordItem }}
        property: root-password
    - secretKey: wordpress-password
      remoteRef:
        key: {{ required "externalSecret.onePasswordItem is required" .Values.externalSecret.onePasswordItem }}
        property: wordpress-password
    {{- range list "auth-key" "secure-auth-key" "logged-in-key" "nonce-key" "auth-salt" "secure-auth-salt" "logged-in-salt" "nonce-salt" }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.externalSecret.onePasswordItem }}
        property: {{ . }}
    {{- end }}
{{- end }}
