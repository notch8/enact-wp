{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.global.secretName }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecret.storeName is required" .Values.externalSecret.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.global.secretName }}
    creationPolicy: Owner
  data:
    {{- $item := required "externalSecret.onePasswordItem is required" .Values.externalSecret.onePasswordItem }}
    {{- range list "root-password" "wordpress-password" "auth-key" "secure-auth-key" "logged-in-key" "nonce-key" "auth-salt" "secure-auth-salt" "logged-in-salt" "nonce-salt" }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $item }}/{{ . }}
    {{- end }}
{{- end }}
