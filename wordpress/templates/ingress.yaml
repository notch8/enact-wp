{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-wordpress
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    # Body-size annotation for both nginx ingress controller flavors; each
    # ignores the other's. The community controller (kubernetes/ingress-nginx)
    # reads the first, the F5 controller (nginxinc) reads the second.
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress.proxyBodySize | quote }}
    nginx.org/client-max-body-size: {{ .Values.ingress.proxyBodySize | quote }}
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  tls:
    - hosts:
        - {{ required "ingress.hostname is required" .Values.ingress.hostname }}
      secretName: {{ .Release.Name }}-tls
  rules:
    - host: {{ .Values.ingress.hostname }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-wordpress
                port:
                  number: {{ .Values.service.port }}
{{- end }}
