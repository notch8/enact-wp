apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-wordpress
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wordpress
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wordpress
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # These ConfigMaps are consumed via subPath mounts, which Kubernetes
        # never live-updates in a running pod (kubernetes/kubernetes#50345).
        # Hashing their rendered content into the pod template forces a
        # rollout whenever any of them changes.
        checksum/private-site: {{ include (print $.Template.BasePath "/configmap-private-site.yaml") . | sha256sum }}
        checksum/php-uploads: {{ include (print $.Template.BasePath "/configmap-php-uploads.yaml") . | sha256sum }}
        checksum/two-factor: {{ include (print $.Template.BasePath "/configmap-two-factor.yaml") . | sha256sum }}
    spec:
      containers:
        - name: wordpress
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: WORDPRESS_DB_HOST
              value: {{ include "wordpress.mysqlHost" . }}
            - name: WORDPRESS_DB_NAME
              value: {{ .Values.global.database.name }}
            - name: WORDPRESS_DB_USER
              value: {{ .Values.global.database.user }}
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: wordpress-password
            {{- if .Values.twoFactor.enabled }}
            # Read by the two-factor-policy mu-plugin.
            - name: ENACT_2FA_ENFORCE
              value: {{ ternary "1" "0" .Values.twoFactor.enforce | quote }}
            - name: ENACT_2FA_APP_PASSWORD_USERS
              value: {{ .Values.twoFactor.applicationPasswordUsers | toJson | quote }}
            {{- end }}
          ports:
            - containerPort: 80
              name: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: wp-content
              mountPath: /var/www/html
            - name: php-uploads
              mountPath: /usr/local/etc/php/conf.d/uploads.ini
              subPath: uploads.ini
            {{- if .Values.privateSite.enabled }}
            - name: private-site
              mountPath: /var/www/html/wp-content/mu-plugins/private-site.php
              subPath: private-site.php
            {{- end }}
            {{- if .Values.twoFactor.enabled }}
            - name: two-factor
              mountPath: /var/www/html/wp-content/mu-plugins/two-factor-policy.php
              subPath: two-factor-policy.php
            {{- end }}
      volumes:
        - name: wp-content
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-wordpress
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: php-uploads
          configMap:
            name: {{ .Release.Name }}-php-uploads
        {{- if .Values.privateSite.enabled }}
        - name: private-site
          configMap:
            name: {{ .Release.Name }}-private-site
        {{- end }}
        {{- if .Values.twoFactor.enabled }}
        - name: two-factor
          configMap:
            name: {{ .Release.Name }}-two-factor
        {{- end }}
