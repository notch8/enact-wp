name: "Lint"
run-name: Lint of ${{ github.ref_name }} by @${{ github.actor }}

on:
  pull_request:
    branches:
      - main

jobs:
  helm-checks:
    runs-on: ubuntu-latest
    container: dtzar/helm-kubectl:3.9.4
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/helm-checks
