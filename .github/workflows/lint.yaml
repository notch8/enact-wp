name: "Lint"
run-name: Lint of ${{ github.ref_name }} by @${{ github.actor }}

on:
  pull_request:
    branches:
      - main

jobs:
  helm-checks:
    runs-on: ubuntu-latest
    container: dtzar/helm-kubectl:3.9.4
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/helm-checks
