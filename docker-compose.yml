# Local development mirror of the k8s deployment. wordpress builds the same
# Dockerfile CI publishes to GHCR (see "Versions" in README.md), so local dev
# runs the pinned WordPress/PHP CI ships, not whatever wordpress:latest
# floats to. mysql still uses the official, floating mysql:lts.
#
# Usage: docker compose up -d --build, then ./bin/local-setup (see README).
# --build is cheap once cached; it's there so a Dockerfile change always
# takes effect instead of silently reusing a stale local image.
services:
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
      # Forwards the host env var of the same name if set (CI sets it to the
      # commit SHA); omitted entirely otherwise, so the Dockerfile's own
      # ARG default applies for a plain local build.
      args:
        - GIT_REVISION
    image: ghcr.io/notch8/enact-wp:${IMAGE_TAG:-dev}
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      # Application-password auth requires HTTPS unless the environment is
      # declared local; needed so bin/provision can talk to http://localhost.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
      # Two-factor policy mu-plugin settings, mirroring the chart's twoFactor
      # values. Enforcement is off unless you opt in:
      #   ENACT_2FA_ENFORCE=1 docker compose up -d
      ENACT_2FA_ENFORCE: "${ENACT_2FA_ENFORCE:-0}"
      ENACT_2FA_APP_PASSWORD_USERS: '["admin"]'
    volumes:
      - wp_data:/var/www/html
      # The same mu-plugin source the chart mounts in k8s. A directory mount
      # rather than a single-file one, so editor saves (which replace the
      # file) show up in the running container.
      - ./wordpress/files/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
    configs:
      - source: php_uploads_ini
        target: /usr/local/etc/php/conf.d/uploads.ini
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:lts
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  cli:
    image: wordpress:cli
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp_data:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["wp"]
    command: ["--info"]
    profiles: ["cli"]

volumes:
  wp_data:
  db_data:

# Parity with the chart's php-uploads ConfigMap (phpUploads.maxSize).
configs:
  php_uploads_ini:
    content: |
      upload_max_filesize = 64M
      post_max_size = 64M
